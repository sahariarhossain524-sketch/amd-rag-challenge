name: Build and Push AMD RAG Container

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sahariarhossain524-sketch/amd-rag-challenge:latest
            ghcr.io/sahariarhossain524-sketch/amd-rag-challenge:v3
            ghcr.io/sahariarhossain524-sketch/amd-rag-challenge:v4
            ghcr.io/sahariarhossain524-sketch/amd-rag-challenge:v5
            ghcr.io/sahariarhossain524-sketch/amd-rag-challenge:v6
